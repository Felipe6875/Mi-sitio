<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simplificar Fracciones</title>
    <style>
        :root {
        --bg-color: #feca50;
        --text-color: black;
        --container-bg: #DFCBA3;
        --container-text:black;
        --container-border: 2px solid #fec759;
        --input-bg: white;
        --input-text: black;
        --input-border: #f9c04e;
        --button-bg: #FFB607;
        --button-hover: #d8b05f;
        --output-color: black;
        --fraction-border: white;
        --sidebar-bg: #fccf66;
        --sidebar-button-bg: #eca707;
        --sidebar-button-hover: #DFCBA3;
        --sidebar-border: #f9c04e;
        --sidebar-btn-border: #e1a71f;
        --dark-toggle-bg: #333;
        --dark-toggle-hover: #555;
        --toggle-btn: #eca707;
        }
        .dark-mode {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --container-bg: #1e1e1e;
        --container-text: #f1f1f1;
        --container-border: 2px solid #555;
        --input-bg: #1e1e1e;
        --input-text: white;
        --input-border: #ff3939;
        --button-bg: #ff3939;
        --button-hover: #444;
        --output-color: #ff3939;
        --fraction-border: white;
        --sidebar-bg: #1f1f1f;
        --sidebar-button-bg: #ff3939;
        --sidebar-button-hover: #fb6666;
        --sidebar-border: #555;
        --sidebar-btn-border: #535353;
        --dark-toggle-bg: #eca707;
        --dark-toggle-hover:#f2c762;
        --toggle-btn: #555;
        }
        body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background 0.5s, color 0.5s;
        }
        .container {
        background: var(--container-bg);
        color: var(--container-text);
        padding: 30px;
        border: var(--container-border);
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        margin: auto;
        transition: background 0.5s, color 0.5s;
        }
        input {
        width: 80px;
        padding: 5px;
        font-size: 18px;
        text-align: center;
        background: var(--input-bg);
        color: var(--input-text);
        border: 2px solid var(--input-border);
        border-radius: 5px;
        margin: 10px;
        }
        button {
        background: var(--button-bg);
        color: white;
        border: none;
        padding: 10px 15px;
        font-size: 18px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
        }
        button:hover {
        background: var(--button-hover);
        }
        .output {
        margin-top: 15px;
        font-size: 22px;
        font-weight: bold;
        color: var(--output-color);
        }
        .fraction {
        display: inline-block;
        text-align: center;
        font-size: 28px;
        }
        .fraction .numerator {
        border-bottom: 2px solid var(--fraction-border);
        display: block;
        padding: 5px;
        }
        .fraction .denominator {
        display: block;
        padding: 5px;
        }
        .toggle-btn {
        position: fixed;
        left: 5px;
        top: 5px;
        width: 40px;
        height: auto;
        font-size: 36px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--button-bg);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        transition: left 1s;
        min-width: 40px;
        max-width: 40px;
        text-align: center;
        z-index: 1100;
        }
        .sidebar .toggle-btn {
        font-size: 20px;
        background: var(--toggle-btn);
        transition: left 0.3s;
        }
        .sidebar.open .toggle-btn {
        left: 243px;
        }
        .sidebar {
        position: fixed;
        left: -238px;
        top: 0;
        width: 200px;
        height: 100%;
        background: var(--sidebar-bg);
        color: var(--text-color);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: left 0.3s;
        z-index: 1000;
        overflow-y: auto;
        }
        .sidebar.open {
        left: 0;
        border-right: 2.7px solid var(--sidebar-border);
        }
        .sidebar ul {
        list-style: none;
        padding: 0;
        width: 100%;
        }
        .sidebar a {
        width: 100%;
        text-align: left;
        }
        .sidebar button {
        width: 100%;
        padding: 10px;
        background: var(--sidebar-button-bg);
        color: white;
        border: none;
        text-align: center;
        cursor: pointer;
        transition: background 0.3s;
        margin-bottom: 1.8px;
        font-size: 16px;
        border: 1.7px solid var(--sidebar-btn-border);
        }
        .sidebar button:hover {
        background: var(--sidebar-button-hover);
        }
        .sidebar h2{
        padding-bottom: 8px;
        width: 100%;
        margin-top: 1px; 
        margin-bottom: 30px;
        border-bottom: 3px solid var(--sidebar-btn-border);
        }
        .sidebar h3{
        margin-top: 1px; 
        margin-bottom: 0.01px;
        }
        .dark-mode-toggle {
        position: fixed;
        top: 5px;
        right: 3.8px;
        background: var(--dark-toggle-bg);
        color: white;
        border: none;
        padding: 8px 12px;
        font-size: 18px;
        border-radius: 5px;
        cursor: pointer;
        z-index: 1100; /* por encima del menú */
        transition: background 0.3s;
        }
        .dark-mode-toggle:hover {
        background: var(--dark-toggle-hover);
        }
        .dark-mode-toggle.dark-mode {
        background: var(--dark-toggle-bg);
        color: white;
        }
        .dark-mode-toggle.dark-mode:hover {
        background: #555;
        }
        </style>
    </head>
    <body>
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleMenu()">☰</button>
        <h2>Menú</h2>
        <h3>Utilidades</h3>
        <ul>
        <a href="main.html"><button>Simplificación de Raíces</button></a>
        <a><button>Simplificación de Fracciones</button></a>
        </ul>
        <h3>Teoría</h3>
        <ul>
        <a><button>Leyes de las raíces</button></a>
        <a><button>Leyes de Fracciones</button></a>
        </ul>
        <h3>Juegos</h3>
        <ul>
        <a href="numberele.html"><button>Numberele</button></a>
        <a><button>Quiz</button></a>
        </ul>
    </div>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
    <div class="container">
        <h2>Calculadora de Fracciones</h2>
        <p>Ingresa una fracción para simplificarla:</p>
        <input type="number" id="numerador" placeholder="Numerador" />
        <span>/</span>
        <input type="number" id="denominador" placeholder="Denominador" />
        <button onclick="simplificarFraccion()">Simplificar</button>
        <div class="output" id="resultado"></div>
    </div>
    <script>
        function calcularMCD(a, b) {
        while (b !== 0) {
            let temp = b;
            b = a % b;
            a = temp;
        }
        return a;
        }
        function simplificarFraccion() {
        let num = parseInt(document.getElementById("numerador").value);
        let den = parseInt(document.getElementById("denominador").value);
        if (isNaN(num) || isNaN(den) || den === 0) {
            document.getElementById("resultado").innerHTML = "Ingresa valores válidos.";
            return;
        }
        let mcd = calcularMCD(num, den);
        let numSimplificado = num / mcd;
        let denSimplificado = den / mcd;
        let resultadoTexto;
        if (denSimplificado === 1) {
            resultadoTexto = `<span class="fraction">${numSimplificado}</span>`;
        } else {
            resultadoTexto = `
            <div class="fraction">
                <span class="numerator">${numSimplificado}</span>
                <span class="denominator">${denSimplificado}</span>
            </div>
            `;
        }
        document.getElementById("resultado").innerHTML = resultadoTexto;
        }
        function toggleMenu() {
        let sidebar = document.getElementById("sidebar");
        let container = document.querySelector(".container");
        sidebar.classList.toggle("open");
        container.classList.toggle("shift");
        }
        function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        }
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                simplificarFraccion();
            }
        });
    </script>
</body>
</html>
